<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <style>
      .title { fill:#0f172a; font-size:15px; font-weight:600; }
      .label { fill:#1e293b; font-size:13px; }
      .note { fill:#475569; font-size:11px; }
      .box { rx:8; ry:8; stroke-width:1.5; }
      .edge { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <rect class="box" x="360" y="24" width="240" height="54" fill="#eef2ff" stroke="#6366f1"/>
  <text class="title" x="480" y="48" text-anchor="middle">Inbound support message</text>
  <text class="note" x="480" y="66" text-anchor="middle">workflow webhook or direct HTTP</text>

  <line class="edge" x1="480" y1="78" x2="480" y2="116"/>

  <rect class="box" x="270" y="118" width="420" height="70" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="title" x="480" y="146" text-anchor="middle">Thin intake workflow</text>
  <text class="label" x="480" y="168" text-anchor="middle">one call to POST /support, then respond</text>

  <line class="edge" x1="480" y1="188" x2="480" y2="226"/>

  <rect class="box" x="80" y="228" width="800" height="120" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="title" x="100" y="254">Tool service: single composition root</text>

  <rect class="box" x="108" y="274" width="150" height="44" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="183" y="301" text-anchor="middle">Classify</text>
  <rect class="box" x="284" y="274" width="150" height="44" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="359" y="301" text-anchor="middle">Cache check</text>
  <rect class="box" x="460" y="274" width="180" height="44" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="550" y="301" text-anchor="middle">Tool or handoff</text>
  <rect class="box" x="666" y="274" width="160" height="44" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="746" y="301" text-anchor="middle">Write one ticket</text>

  <line class="edge" x1="258" y1="296" x2="282" y2="296"/>
  <line class="edge" x1="434" y1="296" x2="458" y2="296"/>
  <line class="edge" x1="640" y1="296" x2="664" y2="296"/>

  <line class="edge" x1="360" y1="348" x2="280" y2="402"/>
  <line class="edge" x1="600" y1="348" x2="680" y2="402"/>

  <rect class="box" x="100" y="404" width="360" height="72" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="title" x="280" y="432" text-anchor="middle">Offline fixtures</text>
  <text class="note" x="280" y="454" text-anchor="middle">orders, FAQ, slots, deterministic model</text>

  <rect class="box" x="500" y="404" width="360" height="72" fill="#eef2ff" stroke="#6366f1"/>
  <text class="title" x="680" y="432" text-anchor="middle">Persistence</text>
  <text class="note" x="680" y="454" text-anchor="middle">memory or database: tickets, cache, failures</text>
</svg>
